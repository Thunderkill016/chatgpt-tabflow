<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Multi-Chat Coding Hub — TabFlow</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo">⚡</div>
      <div class="nav-title">
        Multi-Chat Coding Hub
        <span class="tag-badge">IDE Mode</span>
      </div>
    </div>

    <!-- Layout Switcher Controls -->
    <div class="nav-controls">
      <div class="layout-btn-group">
        <button id="btn-layout-2" class="layout-btn active" title="Chia 2 cột song song (Frontend / Backend)">
          <span>⬛⬛</span> 2 Cột
        </button>
        <button id="btn-layout-3" class="layout-btn" title="Chia 3 cột song song">
          <span>⬛⬛⬛</span> 3 Cột
        </button>
        <button id="btn-layout-4" class="layout-btn" title="Lưới 4 khung chat (2x2)">
          <span>⊞</span> 4 Ô Lưới
        </button>
      </div>

      <button id="btn-add-pane" class="btn-nav-action" title="Thêm một khung ChatGPT mới">
        <span>➕</span> Thêm Chat
      </button>

      <button id="btn-tile-windows" class="btn-nav-action" title="Chia 2 cửa sổ Chrome thật 50/50 trên màn hình">
        <span>🪟</span> Tile Windows
      </button>
    </div>

    <!-- Right Controls -->
    <div class="nav-actions">
      <button id="btn-toggle-scratchpad" class="btn-nav-action primary" title="Mở/Đóng trình soạn thảo Code tích hợp">
        <span>📝</span> Code Scratchpad
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="workspace-container">
    <!-- Chat Grid (Holds 2 to 4 ChatGPT Panes) -->
    <main id="chat-grid" class="chat-grid layout-2-col">
      <!-- Panes will be injected dynamically by workspace.js -->
    </main>

    <!-- Integrated Code Scratchpad (IDE Sidebar) -->
    <aside id="scratchpad-panel" class="scratchpad-panel">
      <!-- File Tabs Bar -->
      <div class="scratchpad-header">
        <div id="file-tabs-bar" class="file-tabs-bar">
          <!-- Dynamically generated file tabs -->
        </div>
        <button id="btn-new-file" class="btn-add-file" title="Tạo file code mới">➕ File</button>
      </div>

      <!-- Editor Action Toolbar -->
      <div class="editor-toolbar">
        <div class="editor-actions-left">
          <button id="btn-copy-code" class="editor-btn" title="Sao chép toàn bộ code trong file này">📋 Copy</button>
          <button id="btn-download-code" class="editor-btn" title="Tải file code này về máy tính">💾 Tải về</button>
          <button id="btn-clear-code" class="editor-btn" title="Xóa trắng nội dung file">🧹 Xóa</button>
        </div>
        <div class="editor-actions-right">
          <button id="btn-send-to-pane-1" class="editor-btn highlight" title="Gửi code này vào khung Chat 1">📤 Gửi Chat 1</button>
          <button id="btn-send-to-pane-2" class="editor-btn highlight" title="Gửi code này vào khung Chat 2">📤 Gửi Chat 2</button>
        </div>
      </div>

      <!-- Main Editor Area -->
      <div class="editor-main">
        <div id="line-numbers" class="line-numbers">1</div>
        <textarea id="code-textarea" class="code-textarea" spellcheck="false" placeholder="// Viết hoặc dán code của bạn tại đây...&#10;// Nhấn Tab để thụt lề chuẩn, phím tắt Ctrl + S để lưu."></textarea>
      </div>
    </aside>
  </div>

  <!-- Toast Message -->
  <div id="workspace-toast" class="workspace-toast">Đã thực hiện xong</div>

  <script src="workspace.js"></script>
</body>
</html>
