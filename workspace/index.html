<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabFlow Unified Chat Workspace</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo">⚡</div>
      <div class="nav-copy">
        <div class="nav-title">Unified Chat Workspace <span class="tag-badge">v3.2</span></div>
        <div id="workspace-summary" class="nav-subtitle">Đang đồng bộ các tab ChatGPT…</div>
      </div>
    </div>

    <div class="nav-controls">
      <button id="btn-sync-tabs" class="btn-nav-action primary" type="button">↻ Đồng bộ tab</button>
      <button id="btn-new-chat" class="btn-nav-action" type="button">＋ Chat mới</button>
      <button id="btn-takeover" class="btn-nav-action takeover" type="button" title="Sau khi pane đã tải, ngủ đông tab gốc để tránh render trùng">⚡ Take over</button>
      <label class="density-control" for="density-select">
        <span>Mật độ</span>
        <select id="density-select">
          <option value="auto">Auto</option>
          <option value="overview">Overview</option>
          <option value="2">2 cột</option>
          <option value="3">3 cột</option>
          <option value="4">4 cột</option>
          <option value="5">5 cột</option>
        </select>
      </label>
    </div>
  </header>

  <section id="workspace-status" class="workspace-status" aria-live="polite">
    <div class="status-chip"><strong id="stat-panes">0</strong><span>panes</span></div>
    <div class="status-chip"><strong id="stat-sources">0</strong><span>tab gốc</span></div>
    <div class="status-chip"><strong id="stat-sleeping">0</strong><span>đang ngủ</span></div>
    <div class="status-chip"><strong id="stat-ready">0</strong><span>pane ready</span></div>
    <div id="density-warning" class="density-warning"></div>
  </section>

  <main id="chat-grid" class="chat-grid" aria-label="Các cuộc chat trong workspace"></main>

  <section id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">🧩</div>
    <h1>Chưa có ChatGPT tab nào</h1>
    <p>Mở một hoặc nhiều cuộc chat rồi bấm “Đồng bộ tab”, hoặc tạo Chat mới ngay trong workspace.</p>
    <button id="btn-empty-new-chat" class="btn-nav-action primary" type="button">＋ Tạo Chat đầu tiên</button>
  </section>

  <div id="workspace-toast" class="workspace-toast" role="status"></div>

  <template id="pane-template">
    <section class="chat-pane">
      <header class="pane-header">
        <div class="pane-ident">
          <span class="pane-index"></span>
          <div class="pane-title-wrap">
            <div class="pane-title"></div>
            <div class="pane-meta"></div>
          </div>
        </div>
        <div class="pane-tools">
          <button class="pane-btn btn-focus" type="button" title="Phóng to pane">⛶</button>
          <button class="pane-btn btn-composer" type="button" title="Đưa con trỏ vào ô nhập">⌨</button>
          <button class="pane-btn btn-reload" type="button" title="Tải lại pane">↻</button>
          <button class="pane-btn btn-source" type="button" title="Mở tab gốc">↗</button>
          <button class="pane-btn danger btn-remove" type="button" title="Bỏ pane khỏi workspace">×</button>
        </div>
      </header>
      <div class="pane-body">
        <div class="pane-loading"><span class="spinner"></span><span>Đang tải ChatGPT…</span></div>
        <iframe allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
  </template>

  <script type="module" src="workspace.js"></script>
</body>
</html>
