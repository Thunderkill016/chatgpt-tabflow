<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabFlow Unified Chat Workspace</title>
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="spotlight-resize.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo" aria-hidden="true">⚡</div>
      <div class="nav-title">TabFlow Workspace <span class="tag-badge">v3.2</span></div>
      <div class="nav-divider" aria-hidden="true"></div>
      <div id="workspace-summary" class="nav-context">Đang thiết lập secure workspace…</div>
    </div>

    <div class="nav-controls">
      <button id="btn-sync-tabs" class="command-btn primary" type="button" title="Đồng bộ các tab ChatGPT đang mở">
        <span aria-hidden="true">↻</span><span class="command-label">Sync</span>
      </button>
      <button id="btn-new-chat" class="command-btn" type="button" title="Thêm một ChatGPT pane mới">
        <span aria-hidden="true">＋</span><span class="command-label">Chat</span>
      </button>
      <button id="btn-focus-primary" class="command-btn" type="button" title="Phóng to pane chính (F)">
        <span aria-hidden="true">⛶</span><span class="command-label">Focus</span>
      </button>
      <button id="btn-takeover" class="command-btn takeover" type="button" title="Ngủ đông tab gốc sau khi pane đã tải để tránh render trùng">
        <span aria-hidden="true">⚡</span><span class="command-label">Take over</span>
      </button>
      <label class="density-control" for="density-select">
        <span>Layout</span>
        <select id="density-select" aria-label="Kiểu bố trí workspace">
          <option value="auto">Auto</option>
          <option value="spotlight">Spotlight</option>
          <option value="overview">Overview</option>
          <option value="2">2 cột</option>
          <option value="3">3 cột</option>
          <option value="4">4 cột</option>
        </select>
      </label>
    </div>
  </header>

  <main id="chat-grid" class="chat-grid" aria-label="Các cuộc chat trong workspace">
    <div
      id="spotlight-separator"
      class="spotlight-separator"
      role="separator"
      aria-orientation="vertical"
      aria-label="Thay đổi độ rộng pane chính"
      aria-valuemin="48"
      aria-valuemax="78"
      aria-valuenow="64"
      tabindex="-1"
      hidden
    ><span class="spotlight-separator-grip" aria-hidden="true"></span></div>
  </main>

  <section id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">🧩</div>
    <h1>Chưa có ChatGPT tab nào</h1>
    <p>Mở một hoặc nhiều cuộc chat rồi bấm Sync, hoặc tạo chat mới ngay trong workspace.</p>
    <button id="btn-empty-new-chat" class="command-btn primary" type="button">＋ Tạo Chat đầu tiên</button>
  </section>

  <footer class="status-bar" aria-live="polite">
    <div class="status-group">
      <span class="status-item"><strong id="stat-panes">0</strong> chat</span>
      <span class="status-separator">·</span>
      <span class="status-item"><strong id="stat-sources">0</strong> tab gốc</span>
      <span class="status-separator">·</span>
      <span class="status-item"><strong id="stat-sleeping">0</strong> ngủ</span>
      <span class="status-separator">·</span>
      <span class="status-item"><strong id="stat-ready">0</strong> ready</span>
    </div>
    <div id="status-primary" class="status-primary">Main: —</div>
    <div id="density-warning" class="density-warning"></div>
    <div class="shortcut-hint"><kbd>F</kbd> Focus <kbd>Esc</kbd> Overview</div>
  </footer>

  <div id="workspace-toast" class="workspace-toast" role="status"></div>

  <template id="pane-template">
    <section class="chat-pane">
      <header class="pane-header">
        <div class="pane-ident">
          <span class="pane-status-dot" aria-hidden="true"></span>
          <span class="pane-index"></span>
          <div class="pane-title-wrap">
            <div class="pane-title-row">
              <div class="pane-title"></div>
              <span class="pane-main-badge" hidden>MAIN</span>
            </div>
            <div class="pane-meta"></div>
          </div>
        </div>
        <div class="pane-tools">
          <button class="pane-btn btn-primary-pane" type="button" title="Đặt làm pane chính">☆</button>
          <button class="pane-btn btn-focus" type="button" title="Phóng to pane">⛶</button>
          <button class="pane-btn pane-secondary-action btn-composer" type="button" title="Đưa con trỏ vào ô nhập">⌨</button>
          <button class="pane-btn pane-secondary-action btn-reload" type="button" title="Tải lại pane">↻</button>
          <button class="pane-btn pane-secondary-action btn-source" type="button" title="Mở tab gốc">↗</button>
          <button class="pane-btn danger btn-remove" type="button" title="Bỏ pane khỏi workspace">×</button>
        </div>
      </header>
      <div class="pane-body">
        <div class="pane-loading"><span class="spinner"></span><span>Đang tải ChatGPT…</span></div>
        <iframe name="tabflow-workspace-pane" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
  </template>

  <script type="module" src="frame-policy-bootstrap.js"></script>
</body>
</html>
