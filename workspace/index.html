<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabFlow Unified Chat Workspace</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo">⚡</div>
      <div class="nav-copy">
        <div class="nav-title">Unified Chat Workspace <span class="tag-badge">v3.2.1</span></div>
        <div id="workspace-summary" class="nav-subtitle">Đang kết nối các ChatGPT tab…</div>
      </div>
    </div>

    <div class="nav-controls">
      <button id="btn-sync-tabs" class="btn-nav-action primary" type="button">↻ Đồng bộ tab</button>
      <button id="btn-new-chat" class="btn-nav-action" type="button">＋ Chat mới</button>
      <button id="btn-sleep-idle" class="btn-nav-action sleep" type="button" title="Ngủ đông tab nền thực sự idle; tab đang generate được bảo vệ">⚡ Ngủ tab idle</button>
      <label class="density-control" for="density-select">
        <span>Mật độ</span>
        <select id="density-select">
          <option value="auto">Auto</option>
          <option value="overview">Overview</option>
          <option value="2">2 cột</option>
          <option value="3">3 cột</option>
          <option value="4">4 cột</option>
          <option value="5">5 cột</option>
        </select>
      </label>
    </div>
  </header>

  <section class="workspace-status" aria-live="polite">
    <div class="status-chip"><strong id="stat-panes">0</strong><span>chat</span></div>
    <div class="status-chip"><strong id="stat-connected">0</strong><span>connected</span></div>
    <div class="status-chip"><strong id="stat-generating">0</strong><span>generating</span></div>
    <div class="status-chip"><strong id="stat-sleeping">0</strong><span>sleeping</span></div>
    <div id="density-warning" class="density-warning"></div>
  </section>

  <main id="chat-grid" class="chat-grid" aria-label="Các cuộc chat trong workspace"></main>

  <section id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">🧩</div>
    <h1>Chưa có ChatGPT tab nào</h1>
    <p>Mở một hoặc nhiều cuộc chat rồi bấm “Đồng bộ tab”, hoặc tạo Chat mới ngay trong workspace.</p>
    <button id="btn-empty-new-chat" class="btn-nav-action primary" type="button">＋ Tạo Chat đầu tiên</button>
  </section>

  <div id="workspace-toast" class="workspace-toast" role="status"></div>

  <template id="pane-template">
    <section class="chat-pane">
      <header class="pane-header">
        <div class="pane-ident">
          <span class="pane-index"></span>
          <div class="pane-title-wrap">
            <div class="pane-title"></div>
            <div class="pane-meta"></div>
          </div>
        </div>
        <div class="pane-head-actions">
          <span class="pane-state">CONNECTING</span>
          <button class="pane-btn btn-focus" type="button" title="Phóng to pane">⛶</button>
          <button class="pane-btn btn-source" type="button" title="Mở tab gốc">↗</button>
          <button class="pane-btn danger btn-remove" type="button" title="Bỏ pane khỏi workspace">×</button>
        </div>
      </header>

      <div class="pane-body">
        <div class="pane-alert" hidden></div>
        <div class="pane-transcript" aria-live="polite"></div>
        <div class="pane-placeholder">Đang kết nối tới tab ChatGPT gốc…</div>
      </div>

      <footer class="pane-composer">
        <textarea class="pane-input" rows="2" placeholder="Nhập prompt cho chat này…"></textarea>
        <div class="pane-compose-actions">
          <button class="pane-action btn-wake" type="button" hidden>Đánh thức</button>
          <button class="pane-action btn-stop" type="button" hidden>■ Dừng</button>
          <button class="pane-action primary btn-send" type="button">Gửi ↗</button>
        </div>
      </footer>
    </section>
  </template>

  <script type="module" src="workspace.js"></script>
</body>
</html>
