<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT TabFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-brand">
      <div class="popup-icon">⚡</div>
      <span>ChatGPT TabFlow</span>
    </div>
    <span style="font-size: 11px; color: var(--accent-emerald); font-weight: 600;">Anti-Lag</span>
  </div>

  <div class="stats-card">
    <div class="stat-item">
      <span id="popup-tab-count" class="stat-num">0</span>
      <span class="stat-text">Tab ChatGPT</span>
    </div>
    <div class="stat-item" style="text-align: right;">
      <span id="popup-ram-saved" class="stat-num">0 MB</span>
      <span class="stat-text">RAM đã dọn</span>
    </div>
  </div>

  <div class="actions">
    <button id="btn-popup-hub" class="btn btn-primary" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);">
      <span>🖥️</span> Multi-Chat Coding Hub
    </button>
    <button id="btn-popup-freeze" class="btn btn-secondary">
      <span>⚡</span> Turbo Freeze — Dọn RAM Ngay
    </button>
    <button id="btn-popup-sidepanel" class="btn btn-secondary">
      <span>🚀</span> Mở Side Panel Workspace
    </button>
    <button id="btn-popup-group" class="btn btn-secondary">
      <span>📁</span> Gom vào Tab Group
    </button>
  </div>

  <div id="popup-toast" class="toast"></div>

  <div class="footer">
    <span>Phím tắt: Alt+C</span>
    <a id="link-options" class="footer-link">Cài đặt ⚙️</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
