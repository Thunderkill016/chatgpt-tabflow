<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT TabFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="popup-brand">
      <div class="popup-icon">⚡</div>
      <div>
        <strong>TabFlow</strong>
        <span id="popup-version">v3.2.0</span>
      </div>
    </div>
    <span class="local-pill">Local-first</span>
  </header>

  <section class="summary-card" aria-label="Tổng quan ChatGPT">
    <div><strong id="popup-tab-count">0</strong><span>chat</span></div>
    <div><strong id="popup-generating-count">0</strong><span>đang trả lời</span></div>
    <div><strong id="popup-sleeping-count">0</strong><span>đang ngủ</span></div>
  </section>

  <main class="actions">
    <button id="btn-popup-hub" class="btn btn-primary" type="button">
      <span>▦</span><span><strong>Unified Workspace</strong><small>Mở các chat trên một màn hình</small></span>
    </button>
    <button id="btn-popup-sidepanel" class="btn btn-secondary" type="button">
      <span>◫</span><span><strong>Control Center</strong><small>Chats · Memory · Runtime · Projects</small></span>
    </button>
    <button id="btn-popup-recorder" class="btn btn-secondary" type="button">
      <span>●</span><span><strong>Capture Studio</strong><small>Quay/chụp · 4K · Social Ready</small></span>
    </button>

    <div class="utility-row">
      <button id="btn-popup-freeze" class="utility-btn" type="button">☾ Tối ưu chat nền</button>
      <button id="btn-popup-group" class="utility-btn" type="button">▣ Gom Tab Group</button>
    </div>
  </main>

  <div id="popup-toast" class="toast" role="status"></div>

  <footer class="footer">
    <span>Alt+C Control Center · Alt+F Sleep</span>
    <button id="link-options" class="footer-link" type="button">Cài đặt</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
