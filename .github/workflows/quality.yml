name: TabFlow Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v3-cognitive-memory-wave1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run quality gate
        run: npm run quality

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright harness
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run unpacked-extension browser E2E
        run: xvfb-run -a npm run browser:e2e
      - name: Upload browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabflow-browser-e2e
          path: artifacts/browser-e2e
          if-no-files-found: ignore
          retention-days: 7
